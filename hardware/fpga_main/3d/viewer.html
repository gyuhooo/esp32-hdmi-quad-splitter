<title>FPGA Main Board 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 一画面のツール: 上に薄いヘッダ (名前・寸法・操作)、残りが 3D キャンバス。色は基板のレジスト緑と金パッドから取る */
:root { --bg: #eef0ea; --panel: #ffffffcc; --fg: #1d2a22; --muted: #5d6b63; --line: #c9d2c8; --accent: #2e7d4f; --accent-fg: #ffffff; --gold: #b58a2f; --canvas: #dfe4dc;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; --mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1713; --panel: #16221bcc; --fg: #e4ebe5; --muted: #93a398; --line: #2b3b31; --accent: #4fb57a; --accent-fg: #0b1510; --gold: #d9b25f; --canvas: #182219; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0f1713; --panel: #16221bcc; --fg: #e4ebe5; --muted: #93a398; --line: #2b3b31; --accent: #4fb57a; --accent-fg: #0b1510; --gold: #d9b25f; --canvas: #182219; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; display: flex; flex-direction: column; min-height: 100%; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(6px); }
h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
.dims { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dims b { color: var(--gold); font-weight: 500; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
button { font: 500 13px var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
label.tg { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
label.tg input { accent-color: var(--accent); margin: 0; }
#stage { flex: 1 1 auto; min-height: 320px; position: relative; background: var(--canvas); }
canvas { display: block; width: 100%; height: 100%; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--panel); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
.legend { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 10px; font-size: 12px; color: var(--muted); background: var(--panel); padding: 5px 8px; border-radius: 6px; pointer-events: none; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
@media (max-width: 480px) { .legend { display: none; } header { padding: 8px 12px; } .controls { margin-left: 0; } }
</style>

  }
  if (p.lead) { const l = p.lead, [a, b] = up(0, 0.15); addBox(x0 - l, x1 + l, a, b, z0 - l, z1 + l, "lead"); }
  if (p.pins) for (const [c, r] of p.pins) { const [a, b] = up(0, p.pin_h); addBox(c - 0.32, c + 0.32, a, b, r - 0.32, r + 0.32, "pin"); }
}

// ---- 視点操作 (軌道カメラ): ドラッグ回転、ホイール拡大、右ドラッグ移動、タッチ対応
const target = new THREE.Vector3(B.w / 2, 0, B.h / 2);
const view = { theta: Math.PI + 0.55, phi: 1.0, dist: 150 };     // theta: 水平回転、phi: 仰角 (0 = 真上)
const presets = { iso: [Math.PI + 0.55, 1.0, 150], top: [0, 0.001, 130], bot: [Math.PI, Math.PI - 0.001, 130], side: [Math.PI / 2, Math.PI / 2 - 0.12, 120] };   // 表: HDMI の辺が画面の上 (KiCad と同じ向き)、裏: 鏡像 (KiCad の裏面表示と同じ)
let anim = null;
function setView(name) {
  const [th, ph, d] = presets[name]; const from = { ...view }; const t0 = performance.now();
  anim = (now) => { const k = Math.min(1, (now - t0) / 450), e = 1 - Math.pow(1 - k, 3);
    view.theta = from.theta + (th - from.theta) * e; view.phi = from.phi + (ph - from.phi) * e; view.dist = from.dist + (d - from.dist) * e; if (k >= 1) anim = null; };
  for (const b of document.querySelectorAll(".controls button")) b.classList.toggle("on", b.id === "v-" + name);
}
for (const n of Object.keys(presets)) document.getElementById("v-" + n).addEventListener("click", () => setView(n));
document.getElementById("t-parts").addEventListener("change", (e) => { parts.visible = e.target.checked; });
const spin = document.getElementById("t-spin");
function updateCamera() {
  const ph = Math.min(Math.PI - 0.001, Math.max(0.001, view.phi));
  camera.position.set(target.x + view.dist * Math.sin(ph) * Math.sin(view.theta), target.y + view.dist * Math.cos(ph), target.z + view.dist * Math.sin(ph) * Math.cos(view.theta));
  camera.up.set(0, 1, 0); camera.lookAt(target);
}
let drag = null;
canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, btn: e.button, shift: e.shiftKey }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.btn === 2 || drag.shift) { // 移動
    const right = new THREE.Vector3(), upv = new THREE.Vector3(); camera.matrix.extractBasis(right, upv, new THREE.Vector3());
    const k = view.dist * 0.0012; target.addScaledVector(right, -dx * k).addScaledVector(upv, dy * k);
  } else { view.theta -= dx * 0.006; view.phi -= dy * 0.006; view.phi = Math.min(Math.PI - 0.01, Math.max(0.01, view.phi)); }
});
canvas.addEventListener("pointerup", () => { drag = null; }); canvas.addEventListener("pointercancel", () => { drag = null; });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("wheel", (e) => { e.preventDefault(); view.dist = Math.min(600, Math.max(20, view.dist * Math.exp(e.deltaY * 0.0012))); }, { passive: false });
let pinch = null;
canvas.addEventListener("touchstart", (e) => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
canvas.addEventListener("touchmove", (e) => { if (e.touches.length === 2 && pinch) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); view.dist = Math.min(600, Math.max(20, view.dist * pinch / d)); pinch = d; } }, { passive: true });
canvas.addEventListener("touchend", () => { pinch = null; }, { passive: true });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now) {
  if (anim) anim(now); else if (spin.checked && !drag && !reduced) view.theta += 0.004;
  updateCamera(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
